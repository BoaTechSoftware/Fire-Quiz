<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"><title>Administration — Fire Quiz</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="admin.css"></head><body><header class="admin-header"><a class="brand" href="/"><span class="brand-mark">F</span><span>Fire <b>Quiz</b></span></a><div><button class="theme-toggle" id="themeToggle" aria-label="Activer le mode sombre"><span class="theme-icon">☾</span></button><button class="button button-ghost" id="logoutButton">Déconnexion</button></div></header><main class="admin"><p class="eyebrow">ADMINISTRATION</p><h1>Banque de questions</h1><p class="admin-lead">Ajoute, publie ou retire les questions disponibles dans les révisions et le coach.</p><div class="admin-grid"><section class="admin-card form-card"><h2>Nouvelle question</h2><form id="questionForm"><label>Thème<select id="topic" required><option value="incendie">Incendie</option><option value="secours">Secours à personne</option><option value="materiel">Matériel</option><option value="organisation">Organisation</option></select></label><label>Question<textarea id="questionText" required minlength="8" maxlength="500"></textarea></label><fieldset><legend>Réponses — choisis la bonne</legend><label>Réponse 1<input class="answerInput" required maxlength="250"><input type="radio" name="correct" value="0" checked aria-label="Réponse 1 correcte"></label><label>Réponse 2<input class="answerInput" required maxlength="250"><input type="radio" name="correct" value="1" aria-label="Réponse 2 correcte"></label><label>Réponse 3<input class="answerInput" required maxlength="250"><input type="radio" name="correct" value="2" aria-label="Réponse 3 correcte"></label><label>Réponse 4<input class="answerInput" required maxlength="250"><input type="radio" name="correct" value="3" aria-label="Réponse 4 correcte"></label></fieldset><label>Explication validée<textarea id="explanation" required minlength="8" maxlength="1000"></textarea></label><label class="checkbox"><input type="checkbox" id="published" checked> Publier immédiatement</label><p id="adminError" class="admin-error" hidden></p><button class="button button-primary button-full">Ajouter la question</button></form></section><section class="admin-card"><div class="list-title"><h2>Toutes les questions</h2><span id="questionCount"></span></div><div class="filters"><button class="filter active" data-filter="all">Toutes</button><button class="filter" data-filter="incendie">Incendie</button><button class="filter" data-filter="secours">Secours</button><button class="filter" data-filter="materiel">Matériel</button><button class="filter" data-filter="organisation">Organisation</button></div><div id="questionList" class="question-list" aria-live="polite"></div></section></div></main><script src="theme.js"></script><script src="admin.js"></script></body></html>
